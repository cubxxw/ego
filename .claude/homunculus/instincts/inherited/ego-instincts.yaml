# Ego Workflow Bulk Refactor Across Codebase

## Action

Follow the bulk-refactor-across-codebase workflow:
1. Identify the deprecated or changed construct (e.g., interface{}).
2. Search and replace all occurrences across the codebase.
3. Update related test files to match the new usage.
4. Commit changes to all affected files.
5. Open a pull request and merge after review.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: client/egrpc/interceptor.go, client/egrpc/interceptor_test.go, client/egrpc/resolver/stat.go

